name: 3 OAKS upstream diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oaks-official-single-queue
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'try-catch/oaks-capture' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      OAKS_SSH_KEY: ${{ secrets.OAKS_SSH_KEY }}
      OAKS_KNOWN_HOSTS: ${{ secrets.OAKS_KNOWN_HOSTS }}
      OAKS_SSH_HOST: ${{ secrets.OAKS_SSH_HOST }}
      OAKS_MONGO_HOST: ${{ secrets.OAKS_MONGO_HOST }}
      OAKS_MONGO_URI: ${{ secrets.OAKS_MONGO_URI }}
      OAKS_PROVIDER_AUTHORIZED: ${{ secrets.OAKS_PROVIDER_AUTHORIZED }}
      OAKS_GITHUB_TOKEN: ${{ github.token }}
      OAKS_WORKER: diagnostic
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: python3 actions/setup-ssh.py
      - run: node -r ts-node/register actions/worker.ts check
      - run: node -r ts-node/register actions/worker.ts probe
