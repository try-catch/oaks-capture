name: runner probe
on:
  workflow_dispatch:
jobs:
  probe-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "ubuntu-latest 可以拿到 Runner"; uname -a
  probe-24:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "ubuntu-24.04 可以拿到 Runner"; uname -a
